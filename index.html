<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial scale=1.0">

    <title>TO-DOes</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

<style> 
    :root{
        --bg:#ffffff;
        --card:#f7f7f7;
        --border:#e5e5e5;
        --text:#000000;
        --muted:#6b7280;
        --black:#000000;
        --white:#ffffff;
        --shadow: 0 8px 30px rgba(0,0,0,0.04);
    }
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;

    }

    body{

        font-family:'Inter',sans-serif;
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        padding:80px 40px;
        line-height:1.6;

    }

    .app{
        max-width:1200px;
        margin:auto;

    }
    .header{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        margin-bottom:70px;
    }

    .title h1{
        font-size:5rem;
        font-weight:700;
        letter-spacing:-4px;

    }

    .title p{
        margin-top:14px;
        color:var(--muted);
        font-size:1rem;
        font-weight:400;

    }

    .time{
        border:1px solid var(--border);
        background:var(--white);
        padding:18px 24px;
        border-radius:20px;
        font-size:0.95rem;
        color:var(--muted);

    }

    .card{
        background:var(--card);
        border:1px solid var(--border);
        border-radius:30px;
        box-shadow:var(--shadow);

    }

    .task-form{
        padding:40px;
        display:flex;
        flex-direction:column;
        gap:24px;
        margin-bottom:45px;

    }

    input, textarea, select{

        width:100%;
        border:none;
        border-bottom:1px solid var(--border);
        background:transparent;
        padding:20px 5px;
        color:var(--text);
        outline:none;
        font-size:1rem;
        transition:0.2s;
        font-family:'Inter',sans-serif;
    
    }

    input:focus,
    textarea:focus,
    select:focus{
        border-bottom:1px solid var(--black);

    }

    textarea{
        min-height:140px;
        resize:none;

    }

    .row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:30px;

    }

    button{
        background:var(--black);
        color:var(--white);
        border:none;
        padding:20px;
        border-radius:18px;
        font-size:1rem;
        font-weight:500;
        cursor:pointer;
        transition:0.3s;
        margin-top:10px;
    }
/* commit1 */
    button:hover{
        opacity:0.9;
        transform:translateY(-2px);

    }

    .filters{
        display:grid;
        grid-template-columns:2fr 1fr;
        gap:24px;
        margin-bottom:60px;

    }
    
    .filter-box{
        padding:28px

    }
    
    .stats{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:30px;
        margin-bottom:70px;

    }

    .stat{
        padding:40px;

    }

    .stat h2{
        font-size:3.5rem;
        font-weight:600;
        margin-bottom:10px;

    }

    .stat p{
        color:var(--muted);
        font-size:0.95rem;

    }

    .task-list{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
        gap:35px;

    }

    .task{
        padding:38px;
        transition:0.3s;        

    }

    .task:hover{
        transform:translateY(-4px);

    }

    .task.completed{
        opacity:0.5;

    }

    .priority{
        display:inline-block;
        font-size:0.8rem;
        padding:8px 14px;
        border-radius:999px;
        margin-bottom:25px;
        border:1px solid var(--border);
        color:var(--muted);
        text-transform:uppercase;
        letter-spacing:1px;

    }

    .task h3{
        font-size:1.8rem;
        font-weight:600;
        margin-bottom:18px;
        letter-spacing:-1px;

    }

    .task p{
        color:var(--muted);
        margin-bottom:30px;
        font-size:1rem;

    }

    .task small{
        display:block;
        color:var(--muted);
        margin-top:10px;
        font-size:0.9rem;

    }

    .actions{
        display:flex;
        gap:14px;
        margin-top:35px;

    }

    .actions button{
        flex:1;
        margin-top:0;

    }

    .secondary{
        background:#ededed;
        color:black;

    }

    @media(max-width:900px){
        body{
            padding:40px 20px;
        }

        .header{
            flex-direction:column;
            gap:30px;

        }
/* commit2 */
        .title h1{
            font-size:3.5rem;

        }
        
        .row{
            grid-template-columns:1fr;

        }

        .filters{
            grid-template-columns:1fr;

        }

        .stats{
            grid-template-columns:1fr;

        }
    }

</style>
</head>


<body>
<!--Commit3-->
    <div class="app">
        <div class="header">
            <div class="title">
                <h1>ToDOes</h1>
               <p>Clean task management.</p>
            
                </div>
    <div class="time"id="liveTime"></div>
    </div>

    <div class="task-form card">
        <input
            type="text"
            id="taskTitle"
            placeholder="title task"
        >
    
        <textarea id="taskDescription" placeholder="Description"></textarea>

        <div class="row">
            <input type="date" id="taskDate" >
            <select id="taskPriority">
                <option value="low"> Low Priority </option>

                <option value="medium">Medium Priority</option>

                <option value="high">High Priority</option>

            </select>

        </div>

        <button id="addTaskBtn">Add Task</button>

    </div>

    <div class="filters">
        <div class="filter-box card">
            
            <input type="text" id="searchInput" placeholder="Search tasks">

        </div>

        <div class="filter-box card">
            <select id="filterPriority">
                <option value="all">All Priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>

            </select>

        </div>
    </div>
    
    <div class="stats">
        <div class="stat card">
            <h2 id="totalTasks">0</h2>
            <p>Total Tasks</p>

        </div>

        <div class="stat card">

            <h2 id="completedTasks">0</h2>
            <p>Completed</p>
        </div>

        <div class="stat card">
            <h2 id="pendingTasks">0</h2>
            <p>Pending</p>

        </div>
    </div>

    <div class="task-list" id="taskList"></div>

    </div>

<!--Commit4-->
    <script>
        const taskList = document.getElementById("taskList");
        const taskTitle = document.getElementById("taskTitle");
        const taskDescription = document.getElementById("taskDescription");
        const taskDate = document.getElementById("taskDate");
        const taskPriority = document.getElementById("taskPriority");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const searchInput = document.getElementById("searchInput");
        const filterPriority = document.getElementById("filterPriority");
    
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks(){
            localStorage.setItem("tasks",JSON.stringify(tasks));

        }

        function updateClock(){
            const now = new Date();
            
            document.getElementById("liveTime").innerText = now.toLocaleDateString();
        
        }

        setInterval(updateClock,1000);
        updateClock();

        function updateStats(){
            const total = tasks.length;

            const completed = tasks.filter(task => task.completed).length;

            const pending = total - completed;

            document.getElementById("totalTasks").innerText = total;

            document.getElementById("completedTasks").innerText = completed;

            document.getElementById("pendingTasks").innerText = pending;

        }

        function renderTasks(){
            taskList.innerHTML ="";

            const filtered = tasks.filter(task => {

                const searchMatch = 
                    task.title
                    .toLowerCase()
                    .includes(
                        searchInput.value
                        .toLowerCase()
                    );
                
// commit5
                const priorityMatch = filterPriority.value === "all" ||
                    task.priority === filterPriority.value;

                return (searchMatch && priorityMatch);

            });

        filtered
        .reverse()
        .forEach((task,index)=>{
            const div = 
                document.createElement("div");

            div.className = 
                `task card ${task.completed ? "completed":""}`;

            div.innerHTML = `
                <div class="priority">
                    ${task.priority}
                </div>

                <h3>
                    ${task.title}
                </h3>

                <p>
                    ${task.description}
                </p>

                <small>
                    Due:
                    ${task.date || "No date"}
                </small>

                <div class="actions">
                    <button onclick="toggleTask(${index})">
                        ${task.completed ? "Undo": "Complete"}
                    </button>

                    <button class="secondary" onclick="deleteTask(${index})">
                        Delete
                    </button>
                
                </div>

            

            `;
        taskList.appendChild(div);

        });
        updateStats();
        }

        function addTask(){

            if(taskTitle.value.trim() === ""){
                alert(
                    "Please enter a task title."
                );

                return;

            }

            tasks.push({
                title: taskTitle.value,

                description: taskDescription.value,

                date: taskDate.value,

                priority: taskPriority.value,

                completed:false

            });

            saveTasks();
            renderTasks();
            clearInputs();

        }

        function clearInputs(){
            taskTitle.value ="";

            taskDescription.value ="";

            taskDate.value ="";

        }

        function toggleTask(index){
            const reversed =
                [...tasks].reverse();
            
            const actualTask =
                reversed[index];

            const realIndex =
                tasks.indexOf(actualTask);

            tasks[realIndex].completed =
                !tasks[realIndex].completed;

            saveTasks();

            renderTasks();

        }

        function deleteTask(index){
            const reversed =
                [...tasks].reverse();

            const actualTask =
                reversed[index];

            const realIndex =
                tasks.indexOf(actualTask);

            tasks.splice(realIndex,1);

            saveTasks();

            renderTasks();

        }

        searchInput.addEventListener("input",renderTasks);

        filterPriority.addEventListener("change",renderTasks);

        addTaskBtn.addEventListener("click",addTask);

        renderTasks();



// commit6
    </script>


</body>
</html>
