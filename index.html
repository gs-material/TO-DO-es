<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial scale=1.0"

    <title>TO-DO'ing</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

<style> 
    :root{
        --bg:#ffffff;
        --card:#f7f7f7;
        --border:#e5e5e5;
        --text:#000000;
        --muted:#6b7280;
        --black:#000000;
        --white:#ffffff;
        --shadow: 0 8px 30px rgba(0,0,0,0.04);
    }
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;

    }

    body{

        font-family:'Inter',sans-serif;
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        padding:80px 40px;
        line-height:1.6;

    }

    .app{
        max-width:1200px;
        margin:auto;

    }
    .header{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        margin-bottom:70px;
    }

    .title h1{
        font-size:5rem;
        font-weight:700;
        letter-spacing:-4px;

    }

    .title p{
        margin-top:14px;
        color:var(--muted);
        font-size:1rem;
        font-weight:400;

    }

    .time{
        border:1px solid var(--border);
        background:var(--white);
        padding:18px 24px;
        border-radius:20px;
        font-size:0.95rem;
        color:var(--muted);

    }

    .card{
        background:var(--card);
        border:1px solid var(--border);
        border-radius:30px;
        box-shadow:var(--shadow);

    }

    .task-form{
        padding:40px;
        display:flex;
        flex-direction:column;
        gap:24px;
        margin-bottom:45px;

    }

    input, textarea, select{

        width:100%;
        border:none;
        border-bottom:1px solid var(--border);
        background:transparent;
        padding:20px 5px;
        color:var(--text);
        outline:none;
        font-size:1rem;
        transition:0.2s;
        font-family:'Inter',sans-serif;
    
    }

    input:focus,
    textarea:focus,
    select:focus{
        border-bottom:1px solid var(--black);

    }

    textarea{
        min-height:140px;
        resize:none;

    }

    .row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:30px;

    }

    button{
        background:var(--black);
        color:var(--white);
        border:none;
        padding:20px;
        border-radius:18px;
        font-size:1rem;
        font-weight:500;
        cursor:pointer;
        transition:0.3s;
        margin-top:10px;
    }


</style>

<body>    
</body>
</html>
